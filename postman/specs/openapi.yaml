openapi: 3.0.3
info:
  title: Catalog Service
  description: Demo microservice for managing a product catalog.
  version: 1.0.0
servers:
  - url: http://localhost:4006
    description: Local dev server
tags:
  - name: products
    description: Operations on products
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /products:
    get:
      tags: [products]
      summary: List all products
      operationId: listProducts
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [products]
      summary: Create a new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /products/{id}:
    get:
      tags: [products]
      summary: Get a product by ID
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not found
    put:
      tags: [products]
      summary: Update a product
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not found
    delete:
      tags: [products]
      summary: Delete a product
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          description: Unique product ID
        name:
          type: string
          description: Product name
        category:
          type: string
          description: Product category
        price:
          type: number
          description: Price in USD
        inStock:
          type: boolean
          description: Whether the product is currently in stock
      required:
        - id
        - name
        - category
        - price
        - inStock
    ProductInput:
      type: object
      properties:
        id:
          type: string
          description: Unique product ID
        name:
          type: string
          description: Product name
        category:
          type: string
          description: Product category
        price:
          type: number
          description: Price in USD
        inStock:
          type: boolean
          description: Whether the product is currently in stock
